 "#9c36b5"}, {"source": "🏠 Accueil", "target": "📖 Lexique — Comprendre les rapports", "label": "les mots", "color": "#9c36b5"}, {"source": "📖 Lexique — Comprendre les rapports", "target": "Le Fil Conducteur", "label": "le système", "color": "#9c36b5"}, {"source": "🧵 Le Grand Récit — De la Facture à la Stratégie", "target": "Le Fil Conducteur", "label": "la carte technique", "color": "#9c36b5"}, {"source": "🧵 Le Grand Récit — De la Facture à la Stratégie", "target": "🏠 Accueil", "label": "retour au hub", "color": "#9c36b5"}, {"source": "🧵 Le Grand Récit — De la Facture à la Stratégie", "target": "📖 Lexique — Comprendre les rapports", "label": "les mots du récit", "color": "#9c36b5"}], "groups": [{"label": "📚 Documents maîtres — le hub", "color": "#9c36b5", "members": ["Le Fil Conducteur", "🏠 Accueil", "🧵 Le Grand Récit — De la Facture à la Stratégie"]}]};

const W = 1800, H = 1200;
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const gGroups = document.createElementNS(NS,'g');
const gLinks = document.createElementNS(NS,'g');
const gELabels = document.createElementNS(NS,'g');
const gNodes = document.createElementNS(NS,'g');
svg.appendChild(gGroups); svg.appendChild(gLinks); svg.appendChild(gELabels); svg.appendChild(gNodes);
const view = {x:0, y:0, k:1};

// ---------- force layout (velocity Verlet, no CDN) ----------
const masterIds = new Set(DATA.nodes.filter(n=>n.cat==='Documents maîtres').map(n=>n.id));
const nodes = DATA.nodes.map(n => ({
  ...n, x: Math.random()*W, y: Math.random()*H, vx:0, vy:0,
  r: (n.cat==='Documents maîtres' ? 9 : 5.5) + (parseInt(n.id) ? Math.min(3, Math.round(parseInt(n.id)/30)) : 0)
}));
const idx = {}; nodes.forEach((n,i)=>idx[n.id]=i);
const links = DATA.links.map(l => ({s: idx[l.source], t: idx[l.target]}));
const adj = nodes.map(()=>[]);
links.forEach(l => { adj[l.s].push(l.t); adj[l.t].push(l.s); });

const REP = 950, SPRING = 0.02, GRAV = 0.0025, DAMP = 0.85;
function tick() {
  for (let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for (let j=i+1;j<nodes.length;j++){
      const b=nodes[j]; let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy; if(d2<1) d2=1;
      const f=REP/d2; const d=Math.sqrt(d2);
      dx/=d; dy/=d;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
    }
  }
  for (const l of links){
    const a=nodes[l.s], b=nodes[l.t];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-120)*SPRING;
    a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
  }
  for (const n of nodes){
    n.vx += (W/2 - n.x)*GRAV; n.vy += (H/2 - n.y)*GRAV;
    n.vx*=DAMP; n.vy*=DAMP;
    n.x+=n.vx; n.y+=n.vy;
  }
}

// ---------- elements ----------
const linkEls = links.map(l=>{
  const el=document.createElementNS(NS,'line'); el.setAttribute('class','link'); gLinks.appendChild(el); return el;
});
const eLabelEls = DATA.labeled.map(l=>{
  const t=document.createElementNS(NS,'text'); t.setAttribute('class','eLabel');
  t.textContent='→ '+l.label; gELabels.appendChild(t); return t;
});
const nodeEls = nodes.map(n=>{
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','node'+(n.cat==='Documents maîtres'?' master':''));
  const c=document.createElementNS(NS,'circle'); c.setAttribute('r',n.r);
  c.setAttribute('fill', n.color);
  const t=document.createElementNS(NS,'text'); t.textContent=n.label; t.setAttribute('dy',n.r+11);
  g.appendChild(c); g.appendChild(t); gNodes.appendChild(g); return g;
});
const grpRects = [], grpLabels = [];
DATA.groups.forEach(gr=>{
  const r=document.createElementNS(NS,'rect'); r.setAttribute('class','grpRect'); r.setAttribute('rx',16);
  r.setAttribute('fill', gr.color); r.setAttribute('stroke', gr.color);
  const t=document.createElementNS(NS,'text'); t.setAttribute('class','grpLabel');
  t.textContent='📚 '+gr.label;
  gGroups.appendChild(r); gGroups.appendChild(t);
  grpRects.push({rect:r, label:t, members:gr.members.map(m=>idx[m]).filter(i=>i!==undefined)});
});

function draw(){
  const tx = view.x, ty = view.y, k = view.k;
  for (let i=0;i<linkEls.length;i++){
    const a=nodes[links[i].s], b=nodes[links[i].t];
    linkEls[i].setAttribute('x1', a.x*k+tx); linkEls[i].setAttribute('y1', a.y*k+ty);
    linkEls[i].setAttribute('x2', b.x*k+tx); linkEls[i].setAttribute('y2', b.y*k+ty);
  }
  for (let i=0;i<eLabelEls.length;i++){
    const l=DATA.labeled[i]; const a=nodes[idx[l.source]], b=nodes[idx[l.target]];
    eLabelEls[i].setAttribute('x', ((a.x+b.x)/2)*k+tx);
    eLabelEls[i].setAttribute('y', ((a.y+b.y)/2)*k+ty);
    eLabelEls[i].setAttribute('fill', l.color);
  }
  for (const g of grpRects){
    if (!g.members.length){ g.rect.style.display='none'; g.label.style.display='none'; continue; }
    g.rect.style.display=''; g.label.style.display='';
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    for (const i of g.members){
      const n=nodes[i];
      if (n.x<minX) minX=n.x; if (n.x>maxX) maxX=n.x;
      if (n.y<minY) minY=n.y; if (n.y>maxY) maxY=n.y;
    }
    const pad=70;
    g.rect.setAttribute('x', (minX-pad)*k+tx); g.rect.setAttribute('y', (minY-pad)*k+ty);
    g.rect.setAttribute('width', (maxX-minX+2*pad)*k); g.rect.setAttribute('height', (maxY-minY+2*pad)*k);
    g.label.setAttribute('x', (minX-pad+12)*k+tx); g.label.setAttribute('y', (minY-pad+18)*k+ty);
  }
  for (let i=0;i<nodeEls.length;i++){
    const n=nodes[i];
    nodeEls[i].setAttribute('transform', `translate(${n.x*k+tx},${n.y*k+ty}) scale(${k})`);
  }
}

// ---------- interactions ----------
let hovered = -1, selected = -1, dragging = -1, panning = false, panStart = null, panView = null;
function setHover(i){
  if (hovered===i) return;
  hovered=i;
  const hot = new Set();
  if (i>=0){ hot.add(i); adj[i].forEach(j=>hot.add(j)); }
  nodeEls.forEach((el,j)=>{ el.classList.toggle('dim', i>=0 && !hot.has(j)); });
  linkEls.forEach((el,j)=>{ el.classList.toggle('hot', i>=0 && (links[j].s===i||links[j].t===i)); });
}
function showPanel(i){
  selected=i;
  const n=nodes[i];
  const p=document.getElementById('panel');
  document.getElementById('pTitle').textContent = n.label;
  document.getElementById('pMeta').textContent = `Catégorie : ${n.cat}`;
  const tags=document.getElementById('pTags'); tags.innerHTML='';
  const t=document.createElement('span'); t.className='tag';
  t.style.background=n.color; t.textContent=n.cat; tags.appendChild(t);
  const body=document.getElementById('pBody');
  const neigh = [...new Set(adj[i])];
  if (neigh.length){
    const ul=document.createElement('ul');
    for (const j of neigh.slice(0,60)){
      const li=document.createElement('li'); const a=document.createElement('a');
      a.textContent='→ '+nodes[j].label;
      a.addEventListener('click',()=>showPanel(j));
      li.appendChild(a); ul.appendChild(li);
    }
    body.innerHTML='<b>Liens dans le système ('+neigh.length+') :</b>'; body.appendChild(ul);
  } else body.innerHTML='<i>Aucun lien — nœud isolé.</i>';
  document.getElementById('pFile').textContent = n.file||'';
  p.style.display='block';
}
document.getElementById('closePanel').addEventListener('click',()=>{ document.getElementById('panel').style.display='none'; selected=-1; });

svg.addEventListener('pointerdown', e=>{
  const el = e.target.closest('.node');
  if (el){
    const i = nodeEls.indexOf(el);
    dragging=i; running=false;
    const n=nodes[i]; const rect=svg.getBoundingClientRect();
    const px=(e.clientX-rect.left-view.x)/view.k, py=(e.clientY-rect.top-view.y)/view.k;
    n._ox=px-n.x; n._oy=py-n.y;
    el.setPointerCapture(e.pointerId);
  } else {
    panning=true; panStart={x:e.clientX,y:e.clientY}; panView={x:view.x,y:view.y};
  }
});
svg.addEventListener('pointermove', e=>{
  if (dragging>=0){
    const n=nodes[dragging]; const rect=svg.getBoundingClientRect();
    n.x=(e.clientX-rect.left-view.x)/view.k - n._ox;
    n.y=(e.clientY-rect.top-view.y)/view.k - n._oy;
    draw();
  } else if (panning){
    view.x = panView.x + (e.clientX-panStart.x);
    view.y = panView.y + (e.clientY-panStart.y);
    draw();
  }
});
svg.addEventListener('pointerup', e=>{
  if (dragging>=0){
    const i=dragging; dragging=-1; running=true;
    if (i===hovered || e.target.closest('.node')) showPanel(i);
  } else if (panning){ panning=false; }
});
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect=svg.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const f = e.deltaY<0 ? 1.12 : 0.89;
  view.x = mx - (mx-view.x)*f; view.y = my - (my-view.y)*f; view.k*=f;
  draw();
},{passive:false});
nodeEls.forEach((el,i)=>{
  el.addEventListener('pointerenter', ()=>setHover(i));
  el.addEventListener('pointerleave', ()=>{ if(hovered===i) setHover(-1); });
});

// ---------- search ----------
const q = document.getElementById('search');
function doSearch(){
  const s=q.value.trim().toLowerCase();
  nodeEls.forEach((el,i)=>{
    const hit = !s || nodes[i].label.toLowerCase().includes(s);
    el.classList.toggle('searchHit', !!s && hit);
    el.style.display = hit?'':'none';
  });
  linkEls.forEach(el=>el.style.display = s?'none':'');
  eLabelEls.forEach(el=>el.style.display = s?'none':'');
  if (s){
    const i = nodes.findIndex(n=>n.label.toLowerCase().includes(s));
    if (i>=0) showPanel(i);
  }
}
q.addEventListener('input', doSearch);

// ---------- legend & stats ----------
const legend=document.getElementById('legend');
const catColor = {};
DATA.nodes.forEach(n=>{ if(!(n.cat in catColor)) catColor[n.cat]=n.color; });
Object.entries(catColor).forEach(([cat,col])=>{
  const row=document.createElement('div'); row.className='row';
  const dot=document.createElement('span'); dot.className='dot'; dot.style.background=col;
  row.appendChild(dot); row.appendChild(document.createTextNode(cat));
  legend.appendChild(row);
});
const sep=document.createElement('div'); sep.className='sep'; legend.appendChild(sep);
DATA.groups.forEach(g=>{
  const row=document.createElement('div'); row.className='row special';
  row.appendChild(document.createTextNode('📚 '+g.label+' ('+g.members.length+' nœuds)'));
  legend.appendChild(row);
});
const lrow=document.createElement('div'); lrow.className='row special';
lrow.appendChild(document.createTextNode('➜ arêtes étiquetées ('+DATA.labeled.length+')'));
legend.appendChild(lrow);
document.getElementById('stats').textContent = DATA.nodes.length+' nœuds · '+DATA.links.length+' connexions · '+DATA.labeled.length+' étiquetées';
document.getElementById('reset').addEventListener('click',()=>{ view.x=0; view.y=0; view.k=1; });

let running = true;
function loop(){
  if (running) { for(let i=0;i<6;i++) tick(); draw(); }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
